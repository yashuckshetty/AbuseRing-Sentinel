version: '3.8'

services:
  abusering-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    image: abusering-sentinel:latest
    container_name: abusering_sentinel_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-mock}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
